html, body { margin: 0; background: #0E0E0E; }
#esc { position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, #1D1D1D 0%, #0E0E0E 70%); }
#esc > * { position: absolute; }
.humo, .chispa { position: absolute; }
#pasto { transform-box: fill-box; transform-origin: 50% 100%; }
.suelo { left: 0; right: 0; bottom: 0; background: #2A1E12; z-index: 5; }
.suelo svg { position: absolute; left: 0; top: -38px; width: 100%; height: 40px; }
.placa { z-index: 3; }
.monte { z-index: 6; }
.dozer { z-index: 7; }
.chispa { width: 14px; height: 14px; border-radius: 50%; background: #6B4A22; z-index: 6; opacity: 0; }
.humo { width: 26px; height: 26px; border-radius: 50%; background: #9A9A9A; opacity: 0; z-index: 7; }
.titulo { left: 0; right: 0; text-align: center; font-family: 'Alfa Slab One'; color: #fff; white-space: nowrap; z-index: 4; }
.titulo em { font-style: normal; color: #FFC20E; }
.by { left: 0; right: 0; text-align: center; font-family: 'Zilla Slab'; font-weight: 700; color: #C9A227; z-index: 4; display: flex; align-items: center; justify-content: center; gap: 22px; }
.by::before, .by::after { content: ""; position: static; display: block; width: 70px; height: 4px; background: #C9A227; }
.lema { left: 0; right: 0; text-align: center; font-family: 'Zilla Slab'; font-weight: 600; color: #ECE8DE; z-index: 4; }
.lema b { color: #FFC20E; }
.wa { left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; background: #FFC20E; color: #0E0E0E; font-family: 'Alfa Slab One'; padding: 16px 34px 16px 26px; border-radius: 999px; z-index: 4; white-space: nowrap; }
.wa svg { position: static; }
.url { left: 0; right: 0; text-align: center; font-family: 'Zilla Slab'; font-weight: 600; color: #BFC5CC; letter-spacing: 0.06em; z-index: 4; }
.brillo { inset: 0; background: linear-gradient(110deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%); mix-blend-mode: overlay; }

<body>

</div>
<script>
const V = new URLSearchParams(location.search).get("f") === "v";
const W = 1080, H = V ? 1920 : 1080, T = 8000;
const C = V ? { suelo: 1620, dz: 560, placaW: 330, placaTop: 400, tit: 880, titF: 118, by: 1040, byF: 54, lema: 1130, lemaF: 46, wa: 1300, waF: 50, url: 1430, urlF: 32, monteW: 520 }
            : { suelo: 960, dz: 500, placaW: 230, placaTop: 120, tit: 445, titF: 104, by: 585, byF: 46, lema: 660, lemaF: 38, wa: 750, waF: 44, url: 862, urlF: 28, monteW: 440 };
const $ = id => document.getElementById(id);
const esc = $("esc"); esc.style.width = W + "px"; esc.style.height = H + "px";
const suelo = $("suelo"); suelo.style.top = C.suelo + "px";
// pasto
(function () { let d = "", x = 0, s = 11; while (x < 1200) { s = (s * 9301 + 49297) % 233280; const h = 14 + (s / 233280) * 24, w = 9 + (s % 6); d += `M${x} 40 L${x + w / 2 + ((s % 7) - 3)} ${40 - h} L${x + w} 40 Z `; x += w * 0.65; } $("pasto").setAttribute("d", d + "M0 36 H1200 V40 H0 Z"); })();
const placa = $("placa"), ph = C.placaW * 1.25;
Object.assign(placa.style, { width: C.placaW + "px", left: (W - C.placaW) / 2 + "px", top: C.placaTop + "px" });
const dozer = $("dozer"), dzH = C.dz * 140 / 240; Object.assign(dozer.style, { width: C.dz + "px", left: "0px", top: (C.suelo - dzH + 6) + "px" });
const monte = $("monte"), mH = C.monteW * 130 / 230, monteLeft = W / 2 - C.monteW / 2 - 20;
Object.assign(monte.style, { width: C.monteW + "px", height: mH + "px", left: monteLeft + "px", top: (C.suelo - mH + 10) + "px" });
[["titulo", C.tit, C.titF], ["by", C.by, C.byF], ["lema", C.lema, C.lemaF], ["url", C.url, C.urlF]].forEach(([id, t, f]) => Object.assign($(id).style, { top: t + "px", fontSize: f + "px" }));
Object.assign($("wa").style, { top: C.wa + "px", fontSize: C.waF + "px" }); const ic = $("waic"); ic.setAttribute("width", C.waF * 1.1); ic.setAttribute("height", C.waF * 1.1);
if (V) $("lema").innerHTML = "Tu próxima máquina está<br>en el <b>patio amarillo</b>.";

// Línea de tiempo (ms)
const A = [];
function K(el, frames, opts = {}) { // frames: [[ms, props], ...]
  const kf = frames.map(([t, p]) => ({ ...p, offset: t / T }));
  if (kf[0].offset > 0) kf.unshift({ ...frames[0][1], offset: 0 });
  if (kf[kf.length - 1].offset < 1) kf.push({ ...frames[frames.length - 1][1], offset: 1 });
  const a = el.animate(kf, { duration: T, fill: "both", easing: "linear", ...opts }); A.push(a); return a;
}
const bladeFront = C.dz * 212 / 240;           // borde de la cuchilla
const contacto = monteLeft + 26 - bladeFront;  // x del dozer al tocar el monte
const salida = W + 80;                         // dozer fuera por la derecha
const e1 = "cubic-bezier(.25,.7,.35,1)", e2 = "cubic-bezier(.4,0,.9,.6)";
K(dozer, [[0, { transform: `translateX(${-C.dz - 40}px)`, easing: e1 }], [1500, { transform: `translateX(${contacto}px)` }],
  [1620, { transform: `translateX(${contacto - 10}px) rotate(-1.5deg)` }], [1760, { transform: `translateX(${contacto}px)`, easing: e2 }], [3200, { transform: `translateX(${salida}px)` }]]);
K($("cuerpo"), [0, 200, 400, 600, 800, 1000, 1200, 1400, 1800, 2000, 2200, 2400, 2600, 2800, 3000, 3200, 3400].map((t, i) => [t, { transform: `translateY(${i % 2 ? -1.6 : 0}px)` }]));
K($("oruga"), [[0, { strokeDashoffset: 0 }], [3500, { strokeDashoffset: -260 }]]);
const empuje = salida - contacto;
monte.style.transformOrigin = "0 100%";
K(monte, [[1500, { transform: "translateX(0) scale(1)" }], [1620, { transform: "translateX(0) scale(1.03, .97)" }], [1760, { transform: "translateX(0) scale(1)", easing: e2 }], [3200, { transform: `translateX(${empuje}px) scale(1.18)` }]]);
// placa sube desde la tierra
const enterrada = C.suelo - C.placaTop + 30;
K(placa, [[V ? 2980 : 2750, { transform: `translateY(${enterrada}px) scale(.75)`, opacity: 1, easing: "cubic-bezier(.2,.9,.3,1.25)" }], [V ? 3700 : 3500, { transform: "translateY(0) scale(1)" }]]);
K($("brillo"), [[3500, { transform: "translateX(-110%)" }], [4300, { transform: "translateX(110%)" }]]);
// pasto crece cuando pasa la máquina
K($("pasto"), [[0, { transform: "scaleY(0)" }], [2300, { transform: "scaleY(0)", easing: "cubic-bezier(.2,.9,.3,1.3)" }], [3000, { transform: "scaleY(1)" }]]);
// tierra que salta
for (let i = 0; i < 18; i++) {
  const c = document.createElement("div"); c.className = "chispa"; esc.appendChild(c);
  const sz = 12 + (i * 7) % 18, x0 = W / 2 + ((i * 53) % 120) - 60, y0 = C.suelo - 10;
  Object.assign(c.style, { width: sz + "px", height: sz + "px", left: x0 + "px", top: y0 + "px", background: i % 3 ? "#6B4A22" : "#8A6230" });
  const vx = ((i * 97) % 420) - 210, vy = 160 + (i * 41) % 220, t0 = (V ? 2980 : 2750) + (i % 6) * 40;
  const pts = [0, .25, .5, .75, 1].map(f => [t0 + f * 800, { transform: `translate(${vx * f}px, ${-vy * f * 2 + vy * f * f * 2.4}px)`, opacity: f < .9 ? 1 : 0 }]);
  K(c, [[t0 - 1, { opacity: 0 }], ...pts]);
}
// humo del exosto
for (let i = 0; i < 6; i++) {
  const h = document.createElement("div"); h.className = "humo"; dozer.appendChild(h);
  const sx = C.dz / 240; Object.assign(h.style, { left: (138 * sx) + "px", top: (26 * sx) + "px", width: 12 * sx + "px", height: 12 * sx + "px" });
  const t0 = 150 + i * 520;
  K(h, [[t0 - 1, { opacity: 0, transform: "translate(0,0) scale(.6)" }], [t0, { opacity: .7, transform: "translate(0,0) scale(.6)" }], [t0 + 900, { opacity: 0, transform: `translate(${-40 * sx}px, ${-60 * sx}px) scale(2.4)` }]]);
}
// textos
K($("titulo"), [[3300, { clipPath: "inset(0 100% 0 0)", transform: "translateY(20px)", easing: "cubic-bezier(.2,.8,.2,1)" }], [4000, { clipPath: "inset(0 0% 0 0)", transform: "translateY(0)" }]]);
K($("by"), [[3900, { opacity: 0, transform: "translateY(24px)", letterSpacing: ".3em", easing: "cubic-bezier(.2,.8,.2,1)" }], [4600, { opacity: 1, transform: "translateY(0)", letterSpacing: "0em" }]]);
K($("lema"), [[4600, { opacity: 0, transform: "translateY(20px)", easing: "ease-out" }], [5200, { opacity: 1, transform: "translateY(0)" }]]);
K($("wa"), [[5100, { opacity: 0, transform: "translateX(-50%) scale(.6)", easing: "cubic-bezier(.2,.9,.3,1.4)" }], [5600, { opacity: 1, transform: "translateX(-50%) scale(1)" }],
  [6400, { transform: "translateX(-50%) scale(1)" }], [6600, { transform: "translateX(-50%) scale(1.06)" }], [6800, { transform: "translateX(-50%) scale(1)" }]]);
K($("waic"), [[6900, { transform: "rotate(0)" }], [7000, { transform: "rotate(-16deg)" }], [7100, { transform: "rotate(14deg)" }], [7200, { transform: "rotate(-8deg)" }], [7300, { transform: "rotate(0)" }]]);
K($("url"), [[5600, { opacity: 0 }], [6100, { opacity: 1 }]]);
window.ponerTiempo = ms => A.forEach(a => { a.pause(); a.currentTime = ms; });
if (new URLSearchParams(location.search).get("grabar")) ponerTiempo(0);
</script>
